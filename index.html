<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duels Bombsquad ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #1a0525, #2d1b4e, #1a0525);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(2px 2px at 20px 30px, #eec0ff, transparent),
                        radial-gradient(2px 2px at 40px 70px, #ffd4e8, transparent),
                        radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                        radial-gradient(1px 1px at 130px 80px, #ffc0f0, transparent),
                        radial-gradient(2px 2px at 160px 30px, #e0c0ff, transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: twinkle 4s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes twinkle { 0% { opacity: 0.3; } 100% { opacity: 0.8; } }
        .container {
            text-align: center;
            max-width: 420px;
            width: 90%;
            position: relative;
            z-index: 1;
            padding: 40px 20px;
        }
        .avatar {
            width: 110px; height: 110px;
            border-radius: 50%;
            border: 3px solid rgba(255, 182, 213, 0.8);
            box-shadow: 0 0 25px rgba(255, 105, 180, 0.5);
            margin: 0 auto 16px;
            background: #fff; /* White background makes the sketch logo pop! */
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .avatar img {
            width: 75%;
            height: 75%;
            object-fit: contain;
            margin-top: 5px;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(90deg, #ffb6d9, #d4a5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #c9a0dc;
            font-size: 13px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .live-badge {
            display: inline-block;
            background: #ff4757;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            animation: pulse 1.5s infinite;
            margin-bottom: 20px;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; box-shadow: 0 0 10px rgba(255,71,87,0.5); } 50% { opacity: 0.7; box-shadow: 0 0 20px rgba(255,71,87,0.8); } }
        
        .banner {
            width: 100%;
            border-radius: 16px;
            border: 2px solid rgba(255, 182, 213, 0.4);
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.3);
            margin-bottom: 24px;
            display: block;
        }

        .link {
            display: flex;
            align-items: center;
            padding: 16px 24px;
            margin: 14px 0;
            border-radius: 16px;
            text-decoration: none;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            gap: 14px;
        }
        .link:hover { transform: scale(1.04); }
        .link .icon { font-size: 24px; }
        .link .text { text-align: left; }
        .link .text .label { font-size: 11px; opacity: 0.8; font-weight: 400; }
        
        .yt {
            background: linear-gradient(135deg, #ff6b8a, #ee5a6f);
            box-shadow: 0 4px 20px rgba(255, 107, 138, 0.3);
        }
        .dc {
            background: linear-gradient(135deg, #9b8cd8, #7c6bbf);
            box-shadow: 0 4px 20px rgba(155, 140, 216, 0.3);
        }
        
        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: #7a5a8a;
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="container">
        <!-- Logo -->
        <div class="avatar">
            <img src="logo.png" alt="BombSquad Logo">
        </div>
        
        <h1>Duels Bombsquad</h1>
        <p class="subtitle">TEAMS @ INDIA DUELS [MOD]</p>
        <span class="live-badge">🔴 LIVE 24/7</span>

        <!-- Banner -->
        <img src="banner.jpg" alt="Server Banner" class="banner">

        <!-- Buttons -->
        <a href="https://youtube.com/@DuelsBombsquad" class="link yt" target="_blank">
            <span class="icon">📺</span>
            <div class="text">
                <div>YouTube</div>
                <div class="label">Watch us live 24/7 ✨</div>
            </div>
        </a>

        <a href="https://discord.gg/WenjjKYN3" class="link dc" target="_blank">
            <span class="icon">💬</span>
            <div class="text">
                <div>Discord</div>
                <div class="label">Join the community 💜</div>
            </div>
        </a>

        <p class="footer">✨ made with love ✨</p>
    </div>
</body>
</html>
